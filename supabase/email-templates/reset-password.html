<!--
  CampusCast "Reset Password" email.
  Paste into Supabase: Authentication > Emails > Reset Password (Templates tab) > Message body.
  Subject: Your CampusCast password reset code
  {{ .Token }} is the one-time code students type on the /forgot-password page.
-->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f1810;">
  <h2 style="margin: 0 0 12px;">Reset your CampusCast password</h2>
  <p style="margin: 0 0 16px;">Enter this code on the CampusCast reset page, together with your new password:</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 8px; background: #ffe566; border: 2px solid #1f1810; border-radius: 8px; padding: 12px 16px; text-align: center; margin: 0 0 16px;">{{ .Token }}</p>
  <p style="margin: 0 0 16px; color: #5e4f39;">The code expires in 1 hour and works once.</p>
  <p style="margin: 0; color: #5e4f39; font-size: 13px;">If you didn't ask to reset your password, you can ignore this email. Your password won't change.</p>
</div>
